
[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "sanskritai"
version = "0.3.0"
description = "Sanskrit knowledge platform"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
]


[tool.setuptools]
include-package-data = true

# The repository root itself is the SanskritAI package.
package-dir = {SanskritAI = "."}


[tool.setuptools.packages.find]
where = ["."]
include = [
    "SanskritAI",
    "SanskritAI.*",
]
namespaces = false


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    ".",
]
